  <style>
    /* = PAGE VARIABLES = */
    :root {
      --bg-image: url("SDGTISnowBlur-2.png");
      --page-overlay: rgba(0,0,0,.05);
      --card-bg: rgba(31,47,87,.85);
      --button-bg: #5a5a5a;
      --button-hover-bg: #d8e8ff;
      --call-color: #25d366;
      --text-color: #4aa3ff;
      --email-color: #ffffff;
      --facebook-color: #1877f2;
    }

    /* = PAGE = */
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      color: white;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* = BACKGROUND OVERLAY / PAGE SHELL = */
    .overlay {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--page-overlay);
    }

    /* = CONTENT CARD = */
    .content {
      width: 90%;
      max-width: 700px;
      padding: 40px 40px 50px;
      background: var(--card-bg);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 25px black;
    }

    /* = IDENTITY = */
    h1 {
      font-family: "Great Vibes", cursive;
      font-size: 72px;
      font-weight: 400;
      color: white;
      text-shadow:
        2px 2px 8px rgba(0,0,0,.6);
    }

    /* = CONTACT / SOCIAL ACTIONS = */
    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 10px;
      margin-top: 30px;
    }

    /* = BASE BUTTON STYLE = */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 12px;
      background: var(--button-bg);
      color: #0039A6;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
      transition: .3s;
    }

    .btn i {
      font-size: 34px;
      line-height: 1;
    }

    /* = ACTION COLORS = */
    .call i {
      color: var(--call-color);
    }

    .text i {
      color: var(--text-color);
    }

    .email i {
      color: var(--email-color);
    }

    .fb i {
      color: var(--facebook-color);
    }

    /* = BUTTON HOVER = */
    .btn:hover {
      background: var(--button-hover-bg);
      transform: scale(1.05);
      opacity: .9;
    }

    /* = LOCATION = */
    .map-section {
      margin-top: 40px;
      text-align: center;
    }

    .map-section h3 {
      margin-top: 10px;
      margin-bottom: 10px;
      font-size: 24px;
      font-weight: 600;
    }

    .map-section p {
      margin-bottom: 15px;
      font-size: 16px;
      opacity: .9;
    }

    .map-section iframe {
      width: 100%;
      height: 250px;
      border: 0;
      border-radius: 15px;
    }

    /* = BRAND SIGNATURE = */
    .brand-footer {
      margin-top: 57px;
      display: flex;
      justify-content: center;
    }

    .brand-footer a {
      display: inline-flex;
    }

    .brand-signature {
      width: 24px;
      height: 24px;
      display: block;
    }

    /* = MOBILE = */
    @media (max-width: 600px) {

      h1 {
        font-size: 52px;
        line-height: 1;
        white-space: nowrap;
      }

      .button-row {
        justify-content: center;
        flex-wrap: nowrap;
        gap: 8px;
      }

      .btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--button-bg);
      }

      .btn i {
        font-size: 28px;
      }
    }

  </style>
</head>

<body>

  <div class="overlay">

    <div class="content">


      <!-- = IDENTITY = -->
      <h1>Sebastian Davila</h1>

      <!-- = CONTACT / SOCIAL ACTIONS = -->
      <div class="button-row">

        <a
          href="tel:+12544502783"
          class="btn call"
          aria-label="Call Sebastian">

          <i
            class="fa-solid fa-phone"
            aria-hidden="true">
          </i>

        </a>


        <a
          href="sms:+12544502783"
          class="btn text"
          aria-label="Text Sebastian">

          <i
            class="fa-solid fa-comment-sms"
            aria-hidden="true">
          </i>

        </a>


        <a
          href="mailto:sdavila@killeenauto.com"
          class="btn email"
          aria-label="Email Sebastian">

          <i
            class="fa-solid fa-envelope"
            aria-hidden="true">
          </i>

        </a>


        <a
          href="https://urldefense.com/v3/__https://www.facebook.com/share/1DVJFEeLbL/?mibextid=wwXIfr__;!!BrVsjWms-IJ2!boVXmo7LiuSbe4UPRYItJ5fuAfCMNQZhtcqJzEPEO6M5xR17lsAzfDrt6JKNQyMRQ1MBvCnEqfVEmlQrTJZeqj0k2w$ "
          target="_blank"
          rel="noopener noreferrer"
          class="btn fb"
          aria-label="Visit Sebastian on Facebook">

          <i
            class="fa-brands fa-facebook-f"
            aria-hidden="true">
          </i>

        </a>

      </div>


      <!-- = LOCATION = -->
      <div class="map-section">

        <h3>Come See Me</h3>

        <p>
          3221 E Central Texas Expressway, Killeen, TX 76543
        </p>

        <iframe
          src="https://urldefense.com/v3/__https://www.google.com/maps?q=3221*20E*20Central*20Texas*20Expressway*20Killeen*20TX*2076543&output=embed__;JSUlJSUlJQ!!BrVsjWms-IJ2!boVXmo7LiuSbe4UPRYItJ5fuAfCMNQZhtcqJzEPEO6M5xR17lsAzfDrt6JKNQyMRQ1MBvCnEqfVEmlQrTJarbQE2Wg$ "
          allowfullscreen=""
          loading="lazy"
          title="Volkswagen dealership location">
        </iframe>

      </div>


     <!-- = BRAND SIGNATURE = -->
      <div class="brand-footer">

        <a
          href="https://www.vw.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit the official Volkswagen website">

          <img
            class="brand-signature"
            src="VW-logo-white.svg"
            alt="Volkswagen">

        </a>

      </div>

  </div>

</body>

</html>
